[workspace]
members = [
    ".",
    "crates/drdynvc",
    "crates/zgfx",
    "crates/ironrdp-gfx",
    "crates/ironrdp-h264",
    "crates/ironrdp-dvc-local",
    "crates/ironrdp-video",
    "crates/ironrdp-geometry",
    "crates/ironrdp-udp",
    "crates/ironrdp-connector-local",
    "crates/ironrdp-pdu-local",
    "crates/ironrdp-async-local",
    "crates/ironrdp-tokio-local",
]

[package]
name = "irontsc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.5"
cairo-rs = { version = "0.18", features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
dirs = "6.0.0"
futures-util = "0.3"
gtk = { version = "0.10.1", package = "gtk4", features = ["v4_18"] }
inquire = "0.7"
ironrdp = { git = "https://github.com/Devolutions/IronRDP", features = ["connector", "dvc", "input", "cliprdr", "displaycontrol", "graphics", "session", "svc", "rdpdr", "rdpsnd"] }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", features = ["reqwest"] }
picky = "=7.0.0-rc.17"
picky-krb = "=0.11.1"
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "1.15.1"
tap = "1.0"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tokio-util = "0.7"
tracing = "0.1.41"
url = "2.5"
whoami = "1.5"
x509-cert = "0.2"
ironrdp-mstsgu = { git = "https://github.com/Devolutions/IronRDP" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", features = ["rustls"]}
ironrdp-cfg = { git = "https://github.com/Devolutions/IronRDP", version = "0.1.0" }
ironrdp-rdpfile = { git = "https://github.com/Devolutions/IronRDP", version = "0.1.0" }
ironrdp-rdcleanpath = { git = "https://github.com/Devolutions/IronRDP", version = "0.2.1" }
ironrdp-rdpsnd-native = { git = "https://github.com/Devolutions/IronRDP", version = "0.4.1", default-features = false }
ironrdp-propertyset = { git = "https://github.com/Devolutions/IronRDP", version = "0.1.0" }
ironrdp-async = { git = "https://github.com/Devolutions/IronRDP", version = "0.7.0" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", version = "0.1.5" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
adw = { version = "0.8.0", package = "libadwaita", features = ["v1_6"] }
arboard = "3.6.1"

# RDPEGFX + H.264 support
drdynvc = { path = "crates/drdynvc" }
zgfx = { path = "crates/zgfx" }
ironrdp-gfx = { path = "crates/ironrdp-gfx" }
ironrdp-h264 = { path = "crates/ironrdp-h264", optional = true }
ironrdp-dvc = { path = "crates/ironrdp-dvc-local" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP" }
# Video Redirection (MS-RDPEVOR) support
ironrdp-video = { path = "crates/ironrdp-video", optional = true }
ironrdp-geometry = { path = "crates/ironrdp-geometry", optional = true }
# UDP Transport Extension (MS-RDPEUDP) support
ironrdp-udp = { path = "crates/ironrdp-udp" }
rand = "0.8"
sha2 = "0.10"

[features]
default = []
h264 = ["ironrdp-h264"]
video-redirection = ["ironrdp-video", "ironrdp-geometry", "ironrdp-h264"]

[patch."https://github.com/Devolutions/IronRDP"]
ironrdp-dvc = { path = "crates/ironrdp-dvc-local" }
ironrdp-connector = { path = "crates/ironrdp-connector-local" }
ironrdp-pdu = { path = "crates/ironrdp-pdu-local" }
ironrdp-async = { path = "crates/ironrdp-async-local" }
ironrdp-tokio = { path = "crates/ironrdp-tokio-local" }

[patch.crates-io]
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP" }
