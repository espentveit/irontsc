[workspace]
members = [
    ".",
    "crates/clearcodec",
    "crates/irontsc-udp",
    "crates/zgfx",
    "crates/ironrdp-gfx",
    "crates/ironrdp-h264",
    "crates/ironrdp-dvc-local",
    "crates/ironrdp-video",
    "crates/ironrdp-geometry",
    "crates/ironrdp-connector-local",
    "crates/ironrdp-pdu-local",
    "crates/ironrdp-async-local",
    "crates/ironrdp-tokio-local",
    "crates/ironrdp-session-local",
    "crates/ironrdp-core-local",
    "crates/ironrdp-cliprdr-local",
    "crates/ironrdp-acceptor-local",
    "crates/ironrdp-graphics-local",
    "crates/ironrdp-input-local",
    "crates/ironrdp-server-local",
    "crates/ironrdp-svc-local",
    "crates/ironrdp-rdpdr-local",
    "crates/ironrdp-rdpsnd-local",
    "crates/ironrdp-ainput-local",
    "crates/ironrdp-local",
    "crates/ironrdp-mstsgu-local",
    "crates/ironrdp-tls-local",
    "crates/ironrdp-cfg-local",
    "crates/ironrdp-rdpfile-local",
    "crates/ironrdp-rdcleanpath-local",
    "crates/ironrdp-rdpsnd-native-local",
    "crates/ironrdp-propertyset-local",
    "crates/ironrdp-error-local",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc.", "Teleport"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[workspace.dependencies]
expect-test = "1"
proptest = "1.4"
rstest = "0.25"
lazy_static = "1.4"
num-derive = "0.4"
num-traits = "0.2"

[profile.optimized]
inherits = "release"
lto = "fat"           # Full link-time optimization (slower build, faster runtime)
codegen-units = 1     # Maximum optimization opportunities
opt-level = 3         # Maximum optimizations
strip = true          # Strip symbols

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
invalid_reference_casting = "warn"
unused_unsafe = "warn"
missing_unsafe_on_extern = "warn"
unsafe_attr_outside_unsafe = "warn"
ambiguous_negative_literals  = "warn"
keyword_idents_2024 = "warn"
elided_lifetimes_in_paths = "warn"
absolute_paths_not_starting_with_crate = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
keyword_idents = "warn"
noop_method_call = "warn"
macro_use_extern_crate = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_crate_dependencies = "warn"
unused_macro_rules = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"
missing_safety_doc = "warn"
transmute_ptr_to_ptr = "warn"
as_ptr_cast_mut = "warn"
as_pointer_underscore = "warn"
cast_ptr_alignment = "warn"
fn_to_numeric_cast_any = "warn"
ptr_cast_constness = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
filetype_is_file = "warn"
float_cmp = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
as_underscore = "warn"
unwrap_used = "warn"
large_stack_frames = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
needless_raw_strings = "warn"
non_ascii_literal = "warn"
panic = "warn"
precedence_bits = "warn"
rc_mutex = "warn"
same_name_method = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
unused_result_ok = "warn"
missing_panics_doc = "warn"
semicolon_outside_block = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
pub_without_shorthand = "warn"
infinite_loop = "warn"
empty_enum_variants_with_brackets = "warn"
deref_by_slicing = "warn"
multiple_inherent_impl = "warn"
map_with_unused_argument_over_ranges = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
checked_conversions = "warn"
get_unwrap = "warn"
similar_names = "warn"
str_to_string = "warn"
string_to_string = "warn"
std_instead_of_core = "warn"
separated_literal_suffix = "warn"
unused_self = "warn"
useless_let_if_seq = "warn"
string_add = "warn"
range_plus_one = "warn"
self_named_module_files = "warn"
redundant_type_annotations = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
doc_include_without_cfg = "warn"
inline_always = "warn"
large_include_file = "warn"
or_fun_call = "warn"
rc_buffer = "warn"
string_lit_chars_any = "warn"
unnecessary_box_returns = "warn"
allow_attributes = "warn"
cfg_not_test = "warn"
disallowed_script_idents = "warn"
non_zero_suggestions = "warn"
renamed_function_params = "warn"
unused_trait_names = "warn"
collection_is_never_read = "warn"
copy_iterator = "warn"
expl_impl_clone_on_copy = "warn"
implicit_clone = "warn"
large_types_passed_by_value = "warn"
redundant_clone = "warn"
alloc_instead_of_core = "warn"
empty_drop = "warn"
return_self_not_must_use = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
print_stderr = "warn"
print_stdout = "warn"
dbg_macro = "warn"
todo = "warn"

[package]
name = "irontsc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.5"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"

# Shared with egui_glow so the tree holds one glow.
glow = "0.16"
dirs = "6.0.0"
futures-util = "0.3"
inquire = "0.7"
ironrdp = { path = "crates/ironrdp-local", features = ["connector", "dvc", "input", "cliprdr", "displaycontrol", "graphics", "session", "svc", "rdpdr", "rdpsnd"] }
ironrdp-displaycontrol = { path = "crates/ironrdp-displaycontrol-local" }
ironrdp-tokio = { path = "crates/ironrdp-tokio-local", features = ["reqwest"] }
picky = "=7.0.0-rc.17"
picky-krb = "=0.11.1"
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "1.15.1"
tap = "1.0"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tokio-util = "0.7"
tracing = "0.1.41"
url = "2.5"
whoami = "1.5"
x509-cert = "0.2"
rand = "0.8"
sha2 = "0.10"
openssl = "0.10"
ironrdp-mstsgu = { path = "crates/ironrdp-mstsgu-local" }
ironrdp-tls = { path = "crates/ironrdp-tls-local", features = ["rustls"]}
ironrdp-cfg = { path = "crates/ironrdp-cfg-local", version = "0.1.0" }
ironrdp-rdpfile = { path = "crates/ironrdp-rdpfile-local", version = "0.1.0" }
ironrdp-rdcleanpath = { path = "crates/ironrdp-rdcleanpath-local", version = "0.2.1" }
ironrdp-rdpsnd-native = { path = "crates/ironrdp-rdpsnd-native-local", version = "0.4.1", features = ["aac"] }
ironrdp-propertyset = { path = "crates/ironrdp-propertyset-local", version = "0.1.0" }
ironrdp-async = { path = "crates/ironrdp-async-local", version = "0.7.0" }
ironrdp-core = { path = "crates/ironrdp-core-local", version = "0.1.5" }
ironrdp_udp = { path = "crates/irontsc-udp" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# `wayland-data-control` is what makes the clipboard work on a Wayland session: without it
# arboard is X11-only and reaches the desktop through XWayland, which is a different selection
# space from the one Wayland applications read. The protocol it uses also works while the window
# is unfocused, which matters for a session an agent drives in the background.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

# egui frontend. Built as a second binary (src/bin/irontsc-egui.rs) next to the GTK one; the
# window, GL context and event loop are driven directly by winit/glutin rather than eframe so
# that the RDP session can see physical key codes, which eframe hides behind egui's logical
# `Key` enum.
egui = "0.31"
egui_glow = { version = "0.31", features = ["winit"] }
egui-winit = "0.31"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
# Native file picker for Open/Save of .rdp files. The xdg-portal backend goes through
# xdg-desktop-portal over D-Bus, so the dialog is the desktop's own without linking GTK back
# in; the blocking API is fine because the picker only ever opens from the connection dialog,
# where no session is running to keep alive.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1.2.2"
png = "0.18.1"
base64 = "0.23.1"
hyper = { version = "1.11.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "service"] }
tower-service = "0.3.3"
http-body-util = "0.1.5"
egui_term = "0.1.0"
alacritty_terminal = "0.25"
ab_glyph = "0.2"

# System shortcut capture for the egui frontend (Alt+Tab, Super, ... to the remote desktop).
# winit has no API for this, so it is done against the display server directly: the Wayland
# keyboard-shortcuts-inhibit protocol, or XGrabKeyboard on X11. Both are reached through the
# raw handles winit already hands out, and both are optional at runtime.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11-dl = "2.21"

# RDPEGFX + H.264 support
clearcodec = { path = "crates/clearcodec" }
zgfx = { path = "crates/zgfx" }
ironrdp-gfx = { path = "crates/ironrdp-gfx" }
ironrdp-graphics = { path = "crates/ironrdp-graphics-local" }
ironrdp-h264 = { path = "crates/ironrdp-h264", optional = true }
ironrdp-dvc = { path = "crates/ironrdp-dvc-local" }
ironrdp-pdu = { path = "crates/ironrdp-pdu-local" }
# Video Redirection (MS-RDPEVOR) support
ironrdp-video = { path = "crates/ironrdp-video", optional = true }
ironrdp-geometry = { path = "crates/ironrdp-geometry", optional = true }
ironrdp-connector = { path = "crates/ironrdp-connector-local" }
tokio-openssl = "0.6"
openssl-sys = "0.9"
foreign-types = "0.3"
libc = "0.2"
# The MCP session register describes each running session as one small JSON message.
serde_json = "1"

# Seeing the screen without sending it anywhere: PP-OCRv6 for text and a small YOLO for the
# things worth clicking, both ONNX, both on the CPU. A screenful costs tens of milliseconds
# here rather than a round trip and a thousand image tokens at the other end.
#
# Run against ONNX Runtime directly rather than through an OCR toolkit. The two algorithms
# involved -- a threshold and connected components over DBNet's probability map, and a greedy
# CTC decode -- are a page of code between them, and the toolkits that wrap them bring several
# hundred crates and a document-understanding stack that is no use to a desktop.
ort = "=2.0.0-rc.13"
image = "0.25"
imageproc = "0.27"


[dev-dependencies]
# Only to drive the MCP server's own HTTP surface in tests; already in the tree by way of
# ironrdp-tokio, so it costs nothing to build. `rustls-tls` is there purely to settle on a
# crypto provider -- another crate enables rustls without one, and reqwest's client panics at
# construction if none is installed. The tests themselves never leave loopback HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[features]
# h264 is back on by default: ffmpeg-sys-next 9 builds against FFmpeg 8, and without it every
# frame of full-motion video is forced through the progressive codec on the CPU.
default = ["gfx", "h264"]
gfx = []
h264 = ["ironrdp-h264", "ironrdp-gfx/h264"]
video-redirection = ["ironrdp-video", "ironrdp-geometry", "ironrdp-h264", "ironrdp-gfx/h264"]

[patch."https://github.com/Devolutions/IronRDP"]
ironrdp = { path = "crates/ironrdp-local" }
ironrdp-dvc = { path = "crates/ironrdp-dvc-local" }
ironrdp-connector = { path = "crates/ironrdp-connector-local" }
ironrdp-pdu = { path = "crates/ironrdp-pdu-local" }
ironrdp-async = { path = "crates/ironrdp-async-local" }
ironrdp-tokio = { path = "crates/ironrdp-tokio-local" }
ironrdp-session = { path = "crates/ironrdp-session-local" }
ironrdp-cliprdr = { path = "crates/ironrdp-cliprdr-local" }
ironrdp-acceptor = { path = "crates/ironrdp-acceptor-local" }
ironrdp-graphics = { path = "crates/ironrdp-graphics-local" }
ironrdp-input = { path = "crates/ironrdp-input-local" }
ironrdp-server = { path = "crates/ironrdp-server-local" }
ironrdp-svc = { path = "crates/ironrdp-svc-local" }
ironrdp-rdpdr = { path = "crates/ironrdp-rdpdr-local" }
ironrdp-rdpsnd = { path = "crates/ironrdp-rdpsnd-local" }
ironrdp-ainput = { path = "crates/ironrdp-ainput-local" }
ironrdp-displaycontrol = { path = "crates/ironrdp-displaycontrol-local" }

[patch.crates-io]
ironrdp-core = { path = "crates/ironrdp-core-local" }
