[package]
name = "ironrdp-graphics"
version = "0.6.0"
readme = "README.md"
description = "RDP image processing primitives"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
doctest = false
# test = false

[dependencies]
bit_field = "0.10"
bitflags = "2.9"
bitvec = "1.0"
ironrdp-core = { path = "../ironrdp-core-local", version = "0.1" } # public
ironrdp-pdu = { path = "../ironrdp-pdu-local", version = "0.6", features = ["std"] } # public
byteorder = "1.5" # TODO: remove
lazy_static = "1.4"
num-derive = "0.3"
num-traits = "0.2"
yuv = { version = "0.8", features = ["rdp"] }

[dev-dependencies]
bmp = "0.5"
bytemuck = "1.24"
expect-test.workspace = true



