[package]
name = "ironrdp-server"
version = "0.9.0"
readme = "README.md"
description = "Extendable skeleton for implementing custom RDP servers"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
doctest = true
test = false

[features]
default = ["rayon", "qoi", "qoiz"]
helper = ["dep:x509-cert", "dep:rustls-pemfile"]
rayon = ["dep:rayon"]
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi", "ironrdp-pdu/qoiz"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__bench = ["dep:visibility"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["net", "macros", "sync", "rt"] } # public
tokio-rustls = "0.26" # public
async-trait = "0.1"
ironrdp-async = { path = "../ironrdp-async-local", version = "0.7" }
ironrdp-ainput = { path = "../ironrdp-ainput-local", version = "0.4" }
ironrdp-core = { path = "../ironrdp-core-local", version = "0.1" }
ironrdp-pdu = { path = "../ironrdp-pdu-local", version = "0.6" } # public
ironrdp-svc = { path = "../ironrdp-svc-local", version = "0.5" } # public
ironrdp-cliprdr = { path = "../ironrdp-cliprdr-local", version = "0.4" } # public
ironrdp-displaycontrol = { path = "../ironrdp-displaycontrol-local", version = "0.4" } # public
ironrdp-dvc = { path = "../ironrdp-dvc-local", version = "0.4" } # public
ironrdp-tokio = { path = "../ironrdp-tokio-local", version = "0.7" }
ironrdp-acceptor = { path = "../ironrdp-acceptor-local", version = "0.7" } # public
ironrdp-graphics = { path = "../ironrdp-graphics-local", version = "0.6" } # public
ironrdp-rdpsnd = { path = "../ironrdp-rdpsnd-local", version = "0.6" } # public
tracing = { version = "0.1", features = ["log"] }
x509-cert = { version = "0.2.5", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
rayon = { version = "1.10.0", optional = true }
bytes = "1"
visibility = { version = "0.1", optional = true }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }


