[package]
name = "ironrdp-session"
version = "0.7.0"
readme = "README.md"
description = "State machines to drive an RDP session"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
keywords = ["rdp", "ironrdp"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[features]
default = []
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi"]

[dependencies]
ironrdp-core = { path = "../ironrdp-core-local", version = "0.1" } # public
ironrdp-connector = { path = "../ironrdp-connector-local", version = "0.7" } # public - using local patch
ironrdp-svc = { path = "../ironrdp-svc-local", version = "0.5" } # public
ironrdp-dvc = { path = "../ironrdp-dvc-local", version = "0.4" } # public - using local patch
ironrdp-error = { path = "../ironrdp-error-local", version = "0.1" } # public
ironrdp-graphics = { path = "../ironrdp-graphics-local", version = "0.6" } # public
ironrdp-pdu = { path = "../ironrdp-pdu-local", version = "0.6", features = ["std"] } # public - using local patch
ironrdp-displaycontrol = { path = "../ironrdp-displaycontrol-local", version = "0.4" }
tracing = { version = "0.1", features = ["log"] }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true, features = ["std"] }
