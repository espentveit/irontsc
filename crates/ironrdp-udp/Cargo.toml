[package]
name = "ironrdp-udp"
version = "0.1.0"
edition = "2021"
description = "RDP UDP transport extension support (local sidecar)"
license = "MIT OR Apache-2.0"

[lib]
doctest = false
test = true

[dependencies]
bitflags = "2.5"
ironrdp-core = { path = "../ironrdp-core-local", version = "0.1", features = ["std"] }
ironrdp-error = { path = "../ironrdp-error-local", version = "0.1" }
thiserror = "2.0"
