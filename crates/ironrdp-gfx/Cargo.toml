[package]
name = "ironrdp-gfx"
version = "0.1.0"
edition = "2021"
authors = ["irontsc contributors"]
description = "RDPEGFX (MS-RDPEGFX) client implementation for RDP graphics"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
bytes = "1.5"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
# The framing this crate writes has to be the framing it reads, and the reader lives there.
zgfx = { path = "../zgfx" }

[features]
default = []
h264 = []
